# CraftyXHub Nginx Configuration
# ================================
# Add this to your existing Nginx server block for craftyxhub.com
# This proxies share routes to the API so social media crawlers
# see proper OG meta tags (featured image, title, description).
#
# If you're already using Nginx to proxy to the Node server (server.mjs),
# you can add these location blocks for better performance — Nginx handles
# the proxy directly without going through Node first.

# Share bridge routes — proxy to API backend
location /s/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Cache for 5 minutes (matches API Cache-Control header)
    proxy_cache_valid 200 5m;
}

# Crawler-friendly post render — proxy to API backend
location /post/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache_valid 200 1h;
}

# Everything else — serve the SPA
# (keep your existing config for static files + SPA fallback)
